<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Master Kuaför · Yönetim</title>
<style>
:root{--bg:#121110;--card:#211e1b;--line:#35302a;--tx:#f2ece3;--mut:#a89f93;--gold:#c9974a;--gold2:#e8c27d;--red:#b3342e}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font:700 22px Georgia,serif;margin:6px 0 14px}h1 span{color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
input,select{width:100%;background:#15120f;color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:12px;font:16px inherit;font-family:inherit}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.btn{display:inline-block;border:1px solid var(--gold);background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1208;font:700 15px inherit;font-family:inherit;padding:11px 18px;border-radius:999px;cursor:pointer}
.btn.o{background:transparent;color:var(--gold2)}.btn.r{background:transparent;color:#ff8f87;border-color:var(--red)}
.btn.s{padding:7px 12px;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.nav b{font-size:17px;text-align:center;flex:1}
.item{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.time{min-width:92px;font-weight:700;color:var(--gold2);font-size:15px}
.time small{display:block;color:var(--mut);font-weight:500;font-size:12px}
.who{flex:1;min-width:0}.who small{color:var(--mut);display:block}
.who a{color:var(--gold2)}
.blok{opacity:.8}.blok .time{color:#ff8f87}
.empty{color:var(--mut);text-align:center;padding:18px 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:#ff8f87;font-size:14px;margin-top:8px}
details summary{cursor:pointer;font-weight:700;color:var(--gold2)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Master <span>Kuaför</span> · Yönetim</h1>

  <div id="login" class="card" style="display:none">
    <label>E-posta</label><input id="em" type="email" autocomplete="username">
    <label>Şifre</label><input id="pw" type="password" autocomplete="current-password">
    <p class="err" id="lerr"></p>
    <p style="margin-top:12px"><button class="btn" id="go">Giriş yap</button></p>
  </div>

  <div id="app" style="display:none">
    <div class="top" style="margin-bottom:10px"><span id="who" style="color:var(--mut);font-size:13px"></span><button class="btn o s" id="out">Çıkış</button></div>
    <div class="card">
      <div class="nav"><button class="btn o s" id="pv">‹</button><b id="dt"></b><button class="btn o s" id="nx">›</button></div>
      <p style="text-align:center;margin-bottom:8px"><button class="btn o s" id="td">Bugün</button></p>
      <div id="list"></div>
    </div>
    <div class="card">
      <details><summary>+ Randevu ekle (telefonla / dükkâna gelen)</summary>
        <div class="g2"><div><label>Ad</label><input id="an" placeholder="Müşteri adı"></div><div><label>Telefon (isteğe bağlı)</label><input id="ap" type="tel"></div></div>
        <div class="g2"><div><label>Hizmet</label><select id="as"></select></div><div><label>Saat</label><select id="at"></select></div></div>
        <p class="err" id="aerr"></p>
        <p style="margin-top:12px"><button class="btn" id="aok">Ekle</button></p>
      </details>
    </div>
    <div class="card">
      <details><summary>⛔ Saatleri kapat (öğle arası, izin vb.)</summary>
        <div class="g2"><div><label>Başlangıç</label><select id="bs"></select></div><div><label>Bitiş</label><select id="be"></select></div></div>
        <p style="color:var(--mut);font-size:13px;margin-top:8px">Bu aralıkta müşteriler randevu alamaz. Dolu saat varsa uyarı verir.</p>
        <p class="err" id="berr"></p>
        <p style="margin-top:12px"><button class="btn" id="bok">Kapat</button></p>
      </details>
    </div>
  </div>
</div>

<script>
const SB={url:"https://qfqjvwcinxyshxxeolzn.supabase.co",key:"sb_publishable_yruXGVU2Dzvv2znZgCOXow_US-qoldC"};
const $=s=>document.querySelector(s);
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SES=null,CFG=null,DAY=ymd(new Date());
try{SES=JSON.parse(localStorage.getItem('kfs')||'null')}catch(e){}
const save=()=>{try{SES?localStorage.setItem('kfs',JSON.stringify(SES)):localStorage.removeItem('kfs')}catch(e){}};

async function auth(path,body){
  const r=await fetch(SB.url+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||'Giriş başarısız');return j;
}
async function rpc(fn,body,retry=true){
  const r=await fetch(SB.url+'/rest/v1/rpc/'+fn,{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+(SES?SES.access_token:SB.key),'Content-Type':'application/json'},body:JSON.stringify(body)});
  if((r.status===401||r.status===403)&&retry&&SES&&SES.refresh_token){
    try{const j=await auth('token?grant_type=refresh_token',{refresh_token:SES.refresh_token});SES={access_token:j.access_token,refresh_token:j.refresh_token,email:SES.email};save();return rpc(fn,body,false)}catch(e){}
  }
  if(!r.ok){const t=await r.text();throw new Error(t.includes('yetki')?'yetki':'HTTP '+r.status)}
  return r.json();
}
function show(){
  $('#login').style.display=SES?'none':'block';
  $('#app').style.display=SES?'block':'none';
  if(SES){$('#who').textContent=SES.email||'';start()}
}
$('#go').onclick=async()=>{
  $('#lerr').textContent='';
  try{const j=await auth('token?grant_type=password',{email:$('#em').value.trim(),password:$('#pw').value});
    SES={access_token:j.access_token,refresh_token:j.refresh_token,email:j.user&&j.user.email};save();show()}
  catch(e){$('#lerr').textContent='E-posta ya da şifre hatalı.'}
};
$('#out').onclick=()=>{SES=null;save();show()};
async function start(){
  try{
    CFG=await rpc('kuafor_gun',{p_gun:DAY});
    $('#as').innerHTML=CFG.hizmetler.map(h=>`<option>${esc(h.ad)}</option>`).join('');
    let o='';for(let t=CFG.acilis;t<CFG.kapanis;t+=CFG.adim)o+=`<option value="${t}">${hm(t)}</option>`;
    $('#at').innerHTML=o;$('#bs').innerHTML=o;
    let e='';for(let t=CFG.acilis+CFG.adim;t<=CFG.kapanis;t+=CFG.adim)e+=`<option value="${t}">${hm(t)}</option>`;
    $('#be').innerHTML=e;
    load();
  }catch(e){$('#list').innerHTML='<p class="err">Yüklenemedi.</p>'}
}
async function load(){
  const D=new Date(DAY+'T12:00');
  $('#dt').textContent=D.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  try{
    const L=await rpc('kuafor_admin_liste',{p_gun:DAY});
    $('#list').innerHTML=L.length?L.map(r=>{
      const blok=r.hizmet==='Kapalı';
      const tel=r.tel?'0'+r.tel:'';
      return `<div class="item ${blok?'blok':''}"><div class="time">${hm(r.bas)}<small>– ${hm(r.bas+r.sure)}</small></div>
      <div class="who"><b>${esc(r.ad)}</b><small>${esc(r.hizmet)}${r.kaynak==='panel'&&!blok?' · panelden':''}</small>${tel?`<small><a href="tel:+90${r.tel}">${tel}</a></small>`:''}</div>
      <button class="btn r s" data-id="${r.id}">${blok?'Aç':'İptal'}</button></div>`}).join(''):'<p class="empty">Bu gün için randevu yok.</p>';
  }catch(e){
    if(e.message==='yetki'){$('#list').innerHTML='<p class="err">Bu hesap yönetici değil.</p>'}
    else if(/401|403/.test(e.message)){SES=null;save();show()}
    else $('#list').innerHTML='<p class="err">Liste yüklenemedi.</p>';
  }
}
$('#list').onclick=async e=>{const b=e.target.closest('button[data-id]');if(!b)return;
  if(!confirm('Bu kaydı iptal etmek istiyor musunuz?'))return;
  try{await rpc('kuafor_admin_iptal',{p_id:+b.dataset.id});load()}catch(x){alert('İptal edilemedi.')}};
const shift=n=>{const d=new Date(DAY+'T12:00');d.setDate(d.getDate()+n);DAY=ymd(d);load()};
$('#pv').onclick=()=>shift(-1);$('#nx').onclick=()=>shift(1);$('#td').onclick=()=>{DAY=ymd(new Date());load()};
$('#aok').onclick=async()=>{
  $('#aerr').textContent='';
  try{const r=await rpc('kuafor_admin_ekle',{p_ad:$('#an').value.trim(),p_tel:$('#ap').value,p_hizmet:$('#as').value,p_gun:DAY,p_bas:+$('#at').value,p_sure:null,p_adet:1,p_zorla:false});
    if(!r.ok){if(confirm('Bu saat dolu görünüyor. Yine de eklensin mi?')){await rpc('kuafor_admin_ekle',{p_ad:$('#an').value.trim(),p_tel:$('#ap').value,p_hizmet:$('#as').value,p_gun:DAY,p_bas:+$('#at').value,p_sure:null,p_adet:1,p_zorla:true})}else return}
    $('#an').value='';$('#ap').value='';load()}catch(e){$('#aerr').textContent='Eklenemedi.'}
};
$('#bok').onclick=async()=>{
  $('#berr').textContent='';const s=+$('#bs').value,e=+$('#be').value;
  if(e<=s){$('#berr').textContent='Bitiş saati başlangıçtan sonra olmalı.';return}
  try{const r=await rpc('kuafor_admin_ekle',{p_ad:'KAPALI',p_tel:null,p_hizmet:'Kapalı',p_gun:DAY,p_bas:s,p_sure:e-s,p_adet:CFG.kapasite,p_zorla:false});
    if(!r.ok){$('#berr').textContent='Bu aralıkta randevular var. Önce onları iptal edin ya da farklı bir aralık seçin.';return}
    load()}catch(x){$('#berr').textContent='Kapatılamadı.'}
};
show();
</script>
</body>
</html>
